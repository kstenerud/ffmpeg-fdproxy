# Fuzzes FFmpeg's side for five hours every week, and keeps what it finds.
name: fuzz-weekly

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fuzz for 5 hours
        run: make fuzz FUZZ_SECONDS=18000 FUZZ_JOBS="$(nproc)"
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            build/fuzz/crash-*
            build/fuzz/leak-*
            build/fuzz/timeout-*
            build/fuzz/oom-*
            build/fuzz/fuzz-*.log
          if-no-files-found: ignore
