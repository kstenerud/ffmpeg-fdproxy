# Builds the patched FFmpeg for one architecture and runs the suite on it, on that architecture.
# ci.yml and release.yml call it. The toolchain images' cache is kept between runs while the builder
# files that make them are unchanged; the libraries' image (5 GB per architecture, too large for a
# repository's Actions cache) is made each run.
name: build

on:
  workflow_call:
    inputs:
      arch:
        description: amd64 or arm64
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ inputs.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room for the toolchain image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /
      - name: Check out jellyfin-ffmpeg
        run: ./checkout.sh
      # jellyfin's builder keeps buildx's cache of each image it makes in builder/.cache. The
      # toolchain's two, base and base-<target>, take an hour to make and are kept between runs,
      # under a key of the builder files that make them; the libraries' image is too large for the
      # repository's Actions cache and is made each run. A tag's run restores what main's saved.
      - name: The toolchain images' cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/jellyfin-ffmpeg/builder/.cache/*/*/*/base_latest
            build/jellyfin-ffmpeg/builder/.cache/*/*/*/base-*_latest
          key: toolchain-${{ inputs.arch }}-${{ hashFiles('build/jellyfin-ffmpeg/builder/images/base/**', format('build/jellyfin-ffmpeg/builder/images/base-{0}/**', inputs.arch == 'arm64' && 'linuxarm64' || 'linux64')) }}
      - name: Build
        run: make build-${{ inputs.arch }} OUT=dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ inputs.arch }}
          path: dist/*.tar.xz
          if-no-files-found: error

  suite:
    name: suite (${{ inputs.arch }})
    needs: build
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-${{ inputs.arch }}
          path: dist
      - name: Unpack
        run: mkdir -p dist/bin && tar -xJf dist/*.tar.xz -C dist/bin
      - name: Make the films
        run: make media BIN=dist/bin
      - name: Suite
        run: make test BIN=dist/bin
